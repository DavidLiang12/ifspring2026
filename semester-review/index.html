<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Interaction Foundations Review Launch</title>
	<style>
		:root {
			--bg: #f5f5f5;
			--paper: #ffffff;
			--ink: #1f1f1f;
			--muted: #666666;
			--accent-soft: #cfcfcf;
			--line: #e2e2e2;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			font-family: "Avenir Next", "Gill Sans", "Segoe UI", sans-serif;
			color: var(--ink);
			background: var(--bg);
			display: grid;
			place-items: center;
			padding: 2.5rem 1.2rem;
		}

		.frame {
			width: min(1100px, 100%);
			border: 1px solid var(--line);
			border-radius: 20px;
			background: var(--paper);
			overflow: hidden;
		}

		.banner {
			padding: 2.6rem 2.2rem 1.8rem;
			border-bottom: 1px solid var(--line);
			background: var(--paper);
		}

		.eyebrow {
			margin: 0;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: var(--muted);
			font-size: 0.76rem;
			font-weight: 600;
		}

		h1 {
			margin: 0.55rem 0 0;
			font-size: clamp(1.8rem, 4.5vw, 2.7rem);
			line-height: 1.06;
			letter-spacing: -0.02em;
			max-width: 18ch;
		}

		.subhead {
			margin: 0.85rem 0 0;
			color: var(--muted);
			max-width: 55ch;
			line-height: 1.55;
			font-size: 1rem;
		}

		.links {
			padding: 1.4rem;
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 0.9rem;
		}

		.card {
			text-decoration: none;
			color: inherit;
			display: flex;
			flex-direction: column;
			border: 1px solid var(--line);
			border-radius: 14px;
			padding: 0.7rem;
			background: #fafafa;
			transition: border-color 200ms ease, box-shadow 200ms ease;
			min-height: 100%;
		}

		.card:hover,
		.card:focus-visible {
			border-color: var(--accent-soft);
			outline: none;
		}

		.preview {
			aspect-ratio: 16 / 10;
			overflow: hidden;
			border-radius: 10px;
			border: 1px solid var(--line);
			background: #f0f0f0;
		}

		.preview img {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.card-content {
			display: flex;
			flex-direction: column;
			gap: 0.35rem;
			padding: 0.85rem 0.4rem 0.35rem;
			flex: 1;
		}

		.title-row {
			display: flex;
			align-items: flex-start;
			justify-content: flex-start;
			gap: 0.5rem;
		}

		.title-row h2 {
			margin: 0;
			font-size: 1.08rem;
			letter-spacing: -0.01em;
		}

		.tag {
			background: #f1f1f1;
			color: #444444;
			border: 1px solid #d9d9d9;
			border-radius: 999px;
			font-size: 0.75rem;
			padding: 0.28rem 0.62rem;
			letter-spacing: 0.02em;
			white-space: nowrap;
			align-self: flex-start;
			margin-top: auto;
		}

		footer {
			padding: 0.9rem 1.4rem 1.2rem;
			color: var(--muted);
			font-size: 0.83rem;
			border-top: 1px solid var(--line);
			background: var(--paper);
		}

		@media (max-width: 640px) {
			body {
				padding: 1.2rem 0.85rem;
			}

			.banner {
				padding: 1.6rem 1.2rem 1.3rem;
			}

			.links {
				padding: 1rem;
				grid-template-columns: repeat(3, minmax(220px, 1fr));
				overflow-x: auto;
			}

			.card {
				padding: 0.65rem;
			}
		}
	</style>
</head>
<body>
	<main class="frame">
		<header class="banner">
			<p class="eyebrow">Interaction Foundations - Spring 2026</p>
			<h1>Project Launch Board</h1>
			<p class="subhead">End of Semester Review</p>
		</header>

		<section class="links" aria-label="Semester project links">
			<a class="card" href="https://davidliang12.github.io/ifspring2026/recipe/complete/index.html" target="_blank" rel="noopener noreferrer">
				<div class="preview">
					<img src="images/Beef.png" alt="Preview of the Recipe Page project homepage">
				</div>
				<div class="card-content">
					<div class="title-row">
						<h2>Recipe Page</h2>
					</div>
					<span class="tag">Individual Project</span>
				</div>
			</a>

			<a class="card" href="https://annie-tian.github.io/ifspring2026/microsite/final/index.html" target="_blank" rel="noopener noreferrer">
				<div class="preview">
					<img src="images/Lego.png" alt="Preview of the Lego Microsite homepage">
				</div>
				<div class="card-content">
					<div class="title-row">
						<h2>Lego Microsite</h2>
					</div>
					<span class="tag">Role: Creative Director</span>
				</div>
			</a>

			<a class="card" href="https://davidliang12.github.io/ifspring2026/microsite/final/index.html" target="_blank" rel="noopener noreferrer">
				<div class="preview">
					<img src="images/Matcha.png" alt="Preview of the Matcha Microsite homepage">
				</div>
				<div class="card-content">
					<div class="title-row">
						<h2>Matcha Microsite</h2>
					</div>
					<span class="tag">Role: Developer/Designer</span>
				</div>
			</a>
		</section>

		<footer>by David Liang, david.liang@wustl.edu</footer>
	</main>
</body>
</html>
