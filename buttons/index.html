
<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>Buttons &mdash; James Fawcett</title>

		<link href='https://fonts.googleapis.com/css?family=Open+Sans:400,300,300italic,400italic,600,600italic,700,700italic,800,800italic' rel='stylesheet' type='text/css'>
		<link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet' type='text/css'>
		<link href='https://fonts.googleapis.com/css?family=Ubuntu:700' rel='stylesheet' type='text/css'>
		<link href='https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@100;300;400;700;900&family=Oswald:wght@700&family=Bangers&family=Orbitron:wght@400;700&display=swap' rel='stylesheet'>

		<link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">
		<style>

			body {
				color: #333;
				font-family: 'Open Sans', sans-serif;
				margin: 0;
				padding: 0;
			}

			main {
				margin: 40px;
			}

			h1 {
			 	font-size: 30px;
			 	margin-bottom: 40px;
			}

			.button_container {
				border: 1px solid #ddd;
				margin: 0 10px 10px 0;
				padding: 20px;
				width: 300px;
				height: 300px;
				float: left;
				overflow: hidden;
				box-sizing: border-box;
				text-align: center;
			}



			a#btn_spotify {
				display: inline-block;
				height: 50px;
				box-sizing: border-box;
				border-radius: 25px;
				margin: auto;
				margin-top: 100px;
				padding: 10px 40px 0 40px;
				background-color: #2ebd59;
				border: 2px solid #2ebd59;
				color: #fff;
				font-size: 20px;
				font-family: 'Montserrat', sans-serif;
				font-weight: bold;
				text-decoration: none;
				transition: all .5s;
			}

			a#btn_spotify:hover {
				background-color: #fff;
				border: 2px solid #000;
				color: #000;
			}

			a#btn_amazon {
				display: block;
				width: 100px;
				height: 100px;
				box-sizing: border-box;
				border-radius: 50px;
				margin: auto;
				margin-top: 75px;
				padding-top: 8px;
				background-color: #232f3e;
				color: #fff;
				text-align: center;
				font-size: 60px;
				transition: all .2s;
			}

			a#btn_amazon:hover {
				background-color: #fc9a18;
			}

			a#btn_twitter {
				display: inline-block;
				height: 40px;
				box-sizing: border-box;
				border-radius: 4px;
				margin: auto;
				margin-top: 105px;
				padding: 10px 30px 0 30px;
				background-color: #56cdf1;
				color: #fff;
				font-size: 18px;
				font-family: 'Arial', sans-serif;
				font-weight: bold;
				text-decoration: none;
			}

			a#btn_twitter:hover {

				/* Permalink - use to edit and share this gradient: https://colorzilla.com/gradient-editor/#2ebfec+0,28a5cb+100 */
				background: rgb(46,191,236); /* Old browsers */
				background: -moz-linear-gradient(-45deg,  rgba(46,191,236,1) 0%, rgba(40,165,203,1) 100%); /* FF3.6-15 */
				background: -webkit-linear-gradient(-45deg,  rgba(46,191,236,1) 0%,rgba(40,165,203,1) 100%); /* Chrome10-25,Safari5.1-6 */
				background: linear-gradient(135deg,  rgba(46,191,236,1) 0%,rgba(40,165,203,1) 100%); /* W3C, IE10+, FF16+, Chrome26+, Opera12+, Safari7+ */
				filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#2ebfec', endColorstr='#28a5cb',GradientType=1 ); /* IE6-9 fallback on horizontal gradient */

			}

			a#btn_indiegogo {
				display: inline-block;
				position: relative;
				margin:auto;
				margin-top: 100px;
				padding: 8px 16px;
				background-color: #fff;
				color: #eb1478;
				font-family: 'Ubuntu', sans-serif;
				font-size: 30px;
				font-weight: bold;
				text-transform: uppercase;
				text-decoration: none;
				letter-spacing: -2px;
				transition: all .2s;
			}

			a#btn_indiegogo:before {
				content: "";
				display: block;
				width: 0;
				height: 0;
				z-index: 1;
				position: absolute;
				top: 50%;
				left: 50%;
				background-color: #eb1478;
				transition: all .5s;
			}

			a#btn_indiegogo:hover {
				color: #fff;
			}

			a#btn_indiegogo:hover:before {
				width: 100%;
				height: 100%;
				left: 0;
				top: 0;
			}

			a#btn_indiegogo span {
				position: relative;
				z-index: 10;
			}

			a#btn_nike {
				display: inline-block;
				margin-top: 100px;
				padding: 14px 48px;
				background-color: #111;
				color: #fff;
				font-family: 'Oswald', sans-serif;
				font-size: 22px;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 4px;
				text-decoration: none;
				position: relative;
				overflow: hidden;
				transition: all 0.3s ease;
			}

			a#btn_nike::after {
				content: '';
				position: absolute;
				bottom: 0;
				left: -100%;
				width: 100%;
				height: 3px;
				background-color: #fff;
				transition: left 0.4s ease;
			}

			a#btn_nike:hover {
				background-color: #fff;
				color: #111;
			}

			a#btn_nike:hover::after {
				left: 0;
				background-color: #111;
			}

			a#btn_cocacola {
				display: inline-block;
				margin-top: 105px;
				padding: 10px 24px;
				background-color: #fff;
				border-radius: 40px;
				border: 2px solid #f40009;
				transition: background-color 0.3s ease, border-color 0.3s ease;
			}

			a#btn_cocacola img {
				display: block;
				width: 120px;
				height: auto;
				transition: filter 0.3s ease;
			}

			a#btn_cocacola:hover {
				background-color: #f40009;
				border-color: #f40009;
			}

			a#btn_cocacola:hover img {
				filter: brightness(0) invert(1);
			}

			.harley-btn {
				display: inline-block;
				position: relative;
				margin-top: 55px;
				width: 150px;
				height: 150px;
			}

			.harley-btn .harley-wings {
				position: absolute;
				top: 50%;
				left: 50%;
				width: 250px;
				height: auto;
				transform: translate(-50%, -50%) scale(0.5);
				opacity: 0;
				transition: all 0.4s ease;
				z-index: 1;
			}

			.harley-btn .harley-logo {
				position: absolute;
				top: 50%;
				left: 50%;
				width: 120px;
				height: auto;
				transform: translate(-50%, -50%);
				z-index: 2;
				transition: all 0.4s ease;
			}

			.harley-btn:hover .harley-wings {
				opacity: 1;
				transform: translate(-50%, -50%) scale(1);
			}

			.harley-btn:hover .harley-logo {
				transform: translate(-50%, -50%);
			}

			a#btn_instagram {
				display: inline-block;
				margin-top: 85px;
				width: 80px;
				height: 80px;
				border-radius: 20px;
				background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
				color: #fff;
				font-size: 42px;
				line-height: 80px;
				text-align: center;
				transition: all 0.3s ease;
			}

			a#btn_instagram:hover {
				transform: scale(1.1);
				box-shadow: 0 6px 25px rgba(214, 36, 91, 0.6);
			}

			a#btn_ibm {
				display: inline-block;
				margin-top: 90px;
				padding: 14px 30px;
				text-decoration: none;
			}

			a#btn_ibm img {
				display: block;
				width: 120px;
				height: auto;
				filter: brightness(0);
				transition: filter 0.6s ease;
			}

			a#btn_ibm:hover img {
				filter: none;
			}


		</style>
	</head>
	<body>
		<main>

			<h1>Button Styling &mdash; James Fawcett</h1>
			<div class="button_container">
				<a href="http://www.spotify.com" target="_blank" id="btn_spotify">Spotify</a>
			</div>

			<div class="button_container">
				<a href="http://www.amazon.com" target="_blank" id="btn_amazon"><i class="fa fa-amazon"></i></a>
			</div>

			<div class="button_container">
				<a href="http://www.twitter.com" target="_blank" id="btn_twitter">twitter</a>
			</div>

			<div class="button_container">
				<a href="http://www.indiegogo.com" target="_blank" id="btn_indiegogo"><span>indiegogo</span></a>
			</div>

			<div class="button_container">
				<a href="http://www.nike.com/us/en_us/" target="_blank" id="btn_nike">Nike</a>
			</div>

			<div class="button_container">
				<a href="http://www.coca-cola.com/" target="_blank" id="btn_cocacola"><img src="https://upload.wikimedia.org/wikipedia/commons/c/ce/Coca-Cola_logo.svg" alt="Coca-Cola"></a>
			</div>

			<div class="button_container">
				<a href="http://www.harley-davidson.com/" target="_blank" class="harley-btn">
					<img class="harley-wings" src="../buttons/logos/Harley_Wings.png" alt="Harley Wings">
					<img class="harley-logo" src="../buttons/logos/Harley_logo.png" alt="Harley-Davidson">
				</a>
			</div>

			<div class="button_container">
				<a href="https://www.instagram.com/" target="_blank" id="btn_instagram"><i class="fa fa-instagram"></i></a>
			</div>

			<div class="button_container">
				<a href="http://www.ibm.com/" target="_blank" id="btn_ibm"><img src="logos/IBM.png" alt="IBM"></a>
			</div>

		</main>	

	</body>
</html>
